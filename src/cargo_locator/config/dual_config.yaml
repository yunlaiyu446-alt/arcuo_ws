hanger_pose_fusion_node:
  ros__parameters:
    left_pose_topic: "/left/hanger_pose_in_cargo"
    right_pose_topic: "/right/hanger_pose_in_cargo"
    output_pose_topic: "/target_frame/pose"
    output_frame_id: "cargo"
    max_sync_time_diff: 0.05
    position_consistency_threshold: 0.05
    angle_consistency_threshold: 15.0
    left_weight: 1.0
    right_weight: 1.0
    publish_single_observation: true
